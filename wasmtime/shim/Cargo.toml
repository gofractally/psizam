[package]
name = "psizam-wasmtime-shim"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.97"
description = "C ABI over wasmtime for the psizam wasmtime backend"

[lib]
crate-type = ["staticlib"]

# Pin both the package version and the fork revision. Memory16 admission,
# address lowering and compact allocation belong to the canonical fork;
# the revision also participates in the compiled-artifact identity.
[dependencies]
wasmtime = { git = "https://github.com/gofractally/wasmtime", rev = "cfbe29d331f2255b787f653a348a137eb28e678a", version = "=51.0.0", default-features = false, features = [
    "runtime",
    "cranelift",
    "std",
    "threads",
    "parallel-compilation",
    "wat",
    # externref values. psizam admits them (a module can only ever hold null
    # ones, since no host function hands any out), so wasmtime must too. The
    # null collector never collects, which is all that needs.
    "gc",
    "gc-null",
    # Preallocated instance slots (engine option pool_instances).
    "pooling-allocator",
] }

# Used to rewrite modules for deterministic stack accounting. Must match the
# versions wasmtime itself resolves to.
wasmparser = "=0.263.0"
wat = "=1.263.0"
# Runs wasm on a dedicated native stack.
psm = "0.1"
libc = "0.2"
wasm-encoder = { version = "=0.263.0", features = ["wasmparser"] }

[profile.release]
opt-level = 3
debug = 1
panic = "abort"
codegen-units = 16
