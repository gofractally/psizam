name: Compiler qualification
on:
  workflow_dispatch:
    inputs:
      compiler_fixtures_url:
        description: Pinned HTTPS compiler fixture archive (or set PSIZAM_COMPILER_FIXTURES_URL)
        required: false
        type: string

permissions:
  contents: read

jobs:
  execution:
    name: ${{ matrix.os }} / execution and compiler gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            sdk: wasi-sdk-32.0-x86_64-linux
            sdk_sha256: 55fc523ebfbc98f69d1034fcfcb83d1ff5610cd9ab7eceef6cd097a30ba4ef93
          - os: macos-15
            sdk: wasi-sdk-32.0-arm64-macos
            sdk_sha256: 383be7fe00ae04691e1859164fd99970a528c55d624b886ed59f7933898b933d
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned psio
        uses: actions/checkout@v4
        with:
          repository: gofractally/psio
          ref: f6b10ec7d7bba4022cd1c9394f88ad1440b4b2b7
          path: validation-deps/psio
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-dev libsimdjson-dev wabt python3 zlib1g-dev libzstd-dev libedit-dev libxml2-dev
          curl --fail --location --output "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          sudo bash "$RUNNER_TEMP/llvm.sh" 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          echo "CC=/usr/lib/llvm-22/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/lib/llvm-22/bin/clang++" >> "$GITHUB_ENV"
          echo "LLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm" >> "$GITHUB_ENV"
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cmake ninja boost simdjson llvm wabt python
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
          echo "LLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm" >> "$GITHUB_ENV"
      - name: Install pinned WASI SDK
        shell: bash
        env:
          SDK_NAME: ${{ matrix.sdk }}
          SDK_SHA256: ${{ matrix.sdk_sha256 }}
        run: |
          curl --fail --location --output "$RUNNER_TEMP/wasi-sdk.tar.gz" "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-32/$SDK_NAME.tar.gz"
          python3 - <<'PYTHON'
          import hashlib, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'wasi-sdk.tar.gz'
          with p.open('rb') as f:
              assert hashlib.file_digest(f, 'sha256').hexdigest() == os.environ['SDK_SHA256']
          PYTHON
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          echo "PSIZAM_WASI_SDK=$RUNNER_TEMP/$SDK_NAME" >> "$GITHUB_ENV"
      - name: Stage required compiler fixtures
        env:
          FIXTURE_URL: ${{ inputs.compiler_fixtures_url || vars.PSIZAM_COMPILER_FIXTURES_URL }}
        shell: bash
        run: |
          case "$FIXTURE_URL" in https://*) ;; *) echo 'Set repository variable PSIZAM_COMPILER_FIXTURES_URL to the pinned HTTPS archive; required compiler tests cannot be skipped.' >&2; exit 1 ;; esac
          curl --fail --location --output "$RUNNER_TEMP/compiler-fixtures.tar.gz" "$FIXTURE_URL"
          python3 scripts/stage-compiler-fixtures.py --archive "$RUNNER_TEMP/compiler-fixtures.tar.gz" --dest "$RUNNER_TEMP/compiler-fixtures"
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build/validation -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_PSIO="$GITHUB_WORKSPACE/validation-deps/psio" \
            -DPSIZAM_ENABLE_TESTS=ON -DPSIZAM_ENABLE_SPEC_TESTS=OFF \
            -DPSIZAM_ENABLE_LLVM=ON -DLLVM_DIR="$LLVM_DIR" \
            -DPSIZAM_WASI_SDK="$PSIZAM_WASI_SDK" \
            -DPSIZAM_ENABLE_COMPILER_TESTS=ON \
            -DPSIZAM_COMPILER_TEST_DATA="$RUNNER_TEMP/compiler-fixtures"
      - name: Build validation executables
        run: cmake --build build/validation --parallel 2
      - name: Require correct execution
        run: ctest --test-dir build/validation -L execution --output-on-failure --no-tests=error --output-junit execution-results.xml
      - name: Preserve failures and commands
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-${{ matrix.os }}
          path: |
            build/validation/**/execution-results.xml
            build/validation/Testing/Temporary/
            build/validation/tests/validation/results/
          if-no-files-found: warn
